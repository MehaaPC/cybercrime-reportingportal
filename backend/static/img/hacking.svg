  <path d="M90 165 Q120 130 150 165 L150 190 Q120 160 90 190 Z" fill="#060b18" stroke="#ff3b3b" stroke-width="1.5"/>
  <circle cx="106" cy="182" r="3.5" fill="#ff3b3b"/>
