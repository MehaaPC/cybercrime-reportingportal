<svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1a38"/>
      <stop offset="100%" stop-color="#0a1128"/>
    </linearGradient>
  </defs>
  <rect width="400" height="320" rx="16" fill="url(#bgGrad2)"/>

  <!-- Desk -->
  <rect x="60" y="240" width="280" height="14" rx="4" fill="#16234a"/>

  <!-- Person sitting, hands on head (distressed) -->
  <ellipse cx="120" cy="195" rx="38" ry="46" fill="#1e2a52"/>
  <circle cx="120" cy="140" r="26" fill="#f2c9a0"/>
  <path d="M96 130 Q120 105 144 130 L144 140 Q120 122 96 140 Z" fill="#2a1f14"/>
  <!-- arms up to head -->
  <path d="M95 165 Q80 145 100 130" stroke="#f2c9a0" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M145 165 Q160 145 140 130" stroke="#f2c9a0" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- Monitor with skull/lock -->
  <rect x="190" y="90" width="160" height="120" rx="8" fill="#060b18" stroke="#ff3b3b" stroke-width="2"/>
  <rect x="255" y="210" width="30" height="16" fill="#16234a"/>
  <rect x="235" y="226" width="70" height="8" rx="3" fill="#16234a"/>

  <!-- Lock icon -->
  <rect x="245" y="140" width="50" height="38" rx="6" fill="#ff3b3b"/>
  <path d="M255 140 L255 122 Q255 105 270 105 Q285 105 285 122 L285 140" fill="none" stroke="#ff3b3b" stroke-width="8"/>
  <circle cx="270" cy="158" r="6" fill="#0a1128"/>
  <rect x="267" y="158" width="6" height="12" fill="#0a1128"/>

  <!-- Skull eyes on lock body -->
  <circle cx="260" cy="150" r="2.5" fill="#0a1128"/>
  <circle cx="280" cy="150" r="2.5" fill="#0a1128"/>

  <!-- Ransom text lines -->
  <rect x="205" y="105" width="90" height="6" rx="2" fill="#ff3b3b" opacity="0.5"/>
  <rect x="205" y="188" width="130" height="6" rx="2" fill="#ff3b3b" opacity="0.4"/>

  <!-- Warning glow -->
  <circle cx="270" cy="150" r="70" fill="#ff3b3b" opacity="0.06"/>
</svg>
