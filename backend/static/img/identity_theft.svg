<svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1a38"/>
      <stop offset="100%" stop-color="#0a1128"/>
    </linearGradient>
  </defs>
  <rect width="400" height="320" rx="16" fill="url(#bgGrad4)"/>

  <!-- Real person (left, solid) -->
  <ellipse cx="120" cy="200" rx="38" ry="48" fill="#1e2a52"/>
  <circle cx="120" cy="148" r="26" fill="#f2c9a0"/>
  <path d="M96 138 Q120 112 144 138 L144 148 Q120 130 96 148 Z" fill="#3a2a1a"/>

  <!-- Shadow duplicate (right, ghostly/transparent - the thief) -->
  <ellipse cx="230" cy="210" rx="38" ry="48" fill="#060b18" opacity="0.75" stroke="#ff3b3b" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="230" cy="158" r="26" fill="#060b18" opacity="0.85" stroke="#ff3b3b" stroke-width="1.5"/>
  <circle cx="222" cy="156" r="2.5" fill="#ff3b3b"/>
  <circle cx="238" cy="156" r="2.5" fill="#ff3b3b"/>

  <!-- ID card floating between them, being copied -->
  <rect x="150" y="90" width="90" height="58" rx="6" fill="#16234a" stroke="#ff3b3b" stroke-width="2"/>
  <circle cx="172" cy="112" r="10" fill="#8a93ab"/>
  <rect x="188" y="105" width="38" height="5" rx="2" fill="#8a93ab"/>
  <rect x="188" y="116" width="30" height="5" rx="2" fill="#8a93ab"/>
  <rect x="160" y="130" width="60" height="5" rx="2" fill="#ff3b3b" opacity="0.6"/>

  <!-- Duplication arrows -->
  <path d="M195 155 Q195 175 220 178" stroke="#ff3b3b" stroke-width="2" fill="none" marker-end="url(#arrowHead)"/>
  <defs>
    <marker id="arrowHead" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#ff3b3b"/>
    </marker>
  </defs>

  <!-- Ghost copy of ID card near thief -->
  <rect x="205" y="175" width="70" height="45" rx="5" fill="#060b18" opacity="0.6" stroke="#ff3b3b" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Alert icon -->
  <path d="M330 100 L344 128 L316 128 Z" fill="none" stroke="#ffc857" stroke-width="2.5"/>
  <text x="330" y="123" font-family="Arial" font-size="14" fill="#ffc857" text-anchor="middle" font-weight="bold">!</text>
</svg>
