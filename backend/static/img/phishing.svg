<svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1a38"/>
      <stop offset="100%" stop-color="#0a1128"/>
    </linearGradient>
  </defs>
  <rect width="400" height="320" rx="16" fill="url(#bgGrad1)"/>

  <!-- Desk -->
  <rect x="60" y="230" width="280" height="14" rx="4" fill="#16234a"/>

  <!-- Person body -->
  <ellipse cx="150" cy="180" rx="42" ry="52" fill="#1e2a52"/>
  <circle cx="150" cy="118" r="28" fill="#f2c9a0"/>
  <path d="M122 108 Q150 80 178 108 L178 118 Q150 100 122 118 Z" fill="#3a2a1a"/>

  <!-- Laptop -->
  <rect x="110" y="185" width="90" height="55" rx="4" fill="#16234a" stroke="#2a3a66" stroke-width="2"/>
  <rect x="118" y="192" width="74" height="40" rx="2" fill="#0a1128"/>
  <rect x="105" y="238" width="100" height="6" rx="2" fill="#2a3a66"/>

  <!-- Screen glow (envelope on screen) -->
  <rect x="140" y="200" width="34" height="22" rx="2" fill="#ff3b3b" opacity="0.85"/>
  <path d="M140 200 L157 213 L174 200" stroke="#0a1128" stroke-width="2" fill="none"/>

  <!-- Fishing line from off screen hooking the envelope -->
  <path d="M320 60 Q260 90 210 150" stroke="#ff3b3b" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  <path d="M205 150 Q200 160 210 165 Q220 170 215 155" stroke="#ff3b3b" stroke-width="3" fill="none"/>

  <!-- Hooded hacker figure top right -->
  <ellipse cx="320" cy="60" rx="34" ry="40" fill="#060b18" stroke="#ff3b3b" stroke-width="1.5"/>
  <path d="M296 45 Q320 20 344 45 L344 62 Q320 42 296 62 Z" fill="#060b18" stroke="#ff3b3b" stroke-width="1.5"/>
  <circle cx="312" cy="58" r="3" fill="#ff3b3b"/>
  <circle cx="328" cy="58" r="3" fill="#ff3b3b"/>

  <!-- Warning triangle -->
  <path d="M255 165 L268 190 L242 190 Z" fill="none" stroke="#ffc857" stroke-width="2.5"/>
  <text x="255" y="185" font-family="Arial" font-size="13" fill="#ffc857" text-anchor="middle" font-weight="bold">!</text>
</svg>
